<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
  <title id="title">v6'da bir iş nasıl yönlendirilir</title>
  <desc id="desc">İşi sınıfla. Ücretsiz platformlar varsayılan kapalıdır: yalnız taramadan geçen, herkese açık veri uygundur. Yeterli zekâ ve anahtar varsa önce ücretsiz platformu, sonra Antigravity, Codex, ek platformlar ve en son Claude'u tercih et. Yedekleri koru, başka aileye doğrulat. Zekâ eşiği asla düşmez.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#A3ABC8"/></marker>
  </defs>
  <rect width="1200" height="670" rx="22" fill="#0F1222"/>
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" fill="#F2F4FA">
    <text x="40" y="51" font-size="30" font-weight="800">v6'da bir iş nasıl yönlendirilir</text>
    <text x="40" y="84" font-size="18" fill="#A3ABC8">Uygun modeller arasındaki tercih: işe ve kotaya sığan ilk modeli seç.</text>

    <g fill="none" stroke="#A3ABC8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M190 171 H232" marker-end="url(#arrow)"/>
      <path d="M450 171 H492" marker-end="url(#arrow)"/>
      <path d="M740 171 H802" marker-end="url(#arrow)"/>
      <path d="M620 217 V280 H135 V357" marker-end="url(#arrow)"/>
      <path d="M1160 171 H1180 V320 H135"/>
      <path d="M230 410 H267" marker-end="url(#arrow)"/>
      <path d="M445 410 H482" marker-end="url(#arrow)"/>
      <path d="M690 410 H727" marker-end="url(#arrow)"/>
      <path d="M925 410 H962" marker-end="url(#arrow)"/>
    </g>

    <g fill="#1A1F36" stroke-width="3.5">
      <rect x="40" y="125" width="150" height="92" rx="18" stroke="#F2C14E"/>
      <rect x="240" y="125" width="210" height="92" rx="18" stroke="#9B7BF4"/>
      <rect x="500" y="125" width="240" height="92" rx="18" stroke="#4C8DF6"/>
      <rect x="810" y="125" width="350" height="92" rx="18" stroke="#10A37F"/>
      <rect x="40" y="365" width="190" height="90" rx="18" stroke="#4C8DF6"/>
      <rect x="275" y="365" width="170" height="90" rx="18" stroke="#10A37F"/>
      <rect x="490" y="365" width="200" height="90" rx="18" stroke="#9B7BF4"/>
      <rect x="735" y="365" width="190" height="90" rx="18" stroke="#D97757"/>
      <rect x="970" y="365" width="190" height="90" rx="18" stroke="#F2C14E"/>
    </g>

    <g text-anchor="middle" font-size="22" font-weight="700">
      <text x="115" y="179">İş</text>
      <text x="345" y="163">Sınıfla</text>
      <text x="345" y="192" font-size="18" fill="#A3ABC8">Ne kadar zeki?</text>
      <text x="620" y="163">Gizlilik kapısı</text>
      <text x="620" y="192" font-size="18" fill="#A3ABC8">Varsayılan: kapalı</text>
      <text x="985" y="179">Önce ücretsiz platform</text>
      <text x="135" y="418">Antigravity</text>
      <text x="360" y="418">Codex</text>
      <text x="590" y="418">Ek platformlar</text>
      <text x="830" y="402">Claude sonda</text>
      <text x="830" y="431" font-size="18" fill="#A3ABC8">Yedek korunur</text>
      <text x="1065" y="402">Başka aile</text>
      <text x="1065" y="431" font-size="18" fill="#A3ABC8">Doğrular</text>
    </g>

    <g text-anchor="middle" font-size="17" fill="#A3ABC8">
      <text x="771" y="147" font-size="13">Genel</text>
      <text x="620" y="245">Herkese açık veri + temiz tarama</text>
      <text x="985" y="245">Yeterli zekâ ve anahtar varsa</text>
      <text x="360" y="271">Değilse: ücretsiz platformu atla</text>
      <text x="135" y="491">Yedek %0</text>
      <text x="360" y="491">Haftalık %30</text>
      <text x="590" y="491">Senin ayarların</text>
      <text x="830" y="483">Haftalık %30</text>
      <text x="830" y="506">5 saatte %15</text>
      <text x="1065" y="491">Kanıtı kontrol et</text>
    </g>

    <rect x="40" y="535" width="1120" height="74" rx="18" fill="#1A1F36" stroke="#F2C14E" stroke-width="3.5"/>
    <text x="600" y="582" text-anchor="middle" font-size="29" font-weight="800" fill="#F2C14E">Zekâ eşiği asla düşmez</text>
    <text x="600" y="644" text-anchor="middle" font-size="18" fill="#A3ABC8">Kota azalsa veya platform ücretsiz olsa da. Ücretsiz hak, uygun iş sığdıkça önce harcanır.</text>
  </g>
</svg>
