<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
  <title id="title">How one job is routed in v6</title>
  <desc id="desc">Classify the job. Free platforms are closed by default: only public data passing the scan qualifies. Prefer a free platform only with enough intelligence and a key, then Antigravity, Codex, extra platforms and Claude last. Keep reserves and verify with another family. The intelligence threshold never drops.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#A3ABC8"/></marker>
  </defs>
  <rect width="1200" height="670" rx="22" fill="#0F1222"/>
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" fill="#F2F4FA">
    <text x="40" y="51" font-size="30" font-weight="800">How one job is routed in v6</text>
    <text x="40" y="84" font-size="18" fill="#A3ABC8">Preference among eligible models: choose the first that fits the job and quota.</text>

    <g fill="none" stroke="#A3ABC8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M190 171 H232" marker-end="url(#arrow)"/>
      <path d="M450 171 H492" marker-end="url(#arrow)"/>
      <path d="M740 171 H802" marker-end="url(#arrow)"/>
      <path d="M620 217 V280 H135 V357" marker-end="url(#arrow)"/>
      <path d="M1160 171 H1180 V320 H135"/>
      <path d="M230 410 H267" marker-end="url(#arrow)"/>
      <path d="M445 410 H482" marker-end="url(#arrow)"/>
      <path d="M690 410 H727" marker-end="url(#arrow)"/>
      <path d="M925 410 H962" marker-end="url(#arrow)"/>
    </g>

    <g fill="#1A1F36" stroke-width="3.5">
      <rect x="40" y="125" width="150" height="92" rx="18" stroke="#F2C14E"/>
      <rect x="240" y="125" width="210" height="92" rx="18" stroke="#9B7BF4"/>
      <rect x="500" y="125" width="240" height="92" rx="18" stroke="#4C8DF6"/>
      <rect x="810" y="125" width="350" height="92" rx="18" stroke="#10A37F"/>
      <rect x="40" y="365" width="190" height="90" rx="18" stroke="#4C8DF6"/>
      <rect x="275" y="365" width="170" height="90" rx="18" stroke="#10A37F"/>
      <rect x="490" y="365" width="200" height="90" rx="18" stroke="#9B7BF4"/>
      <rect x="735" y="365" width="190" height="90" rx="18" stroke="#D97757"/>
      <rect x="970" y="365" width="190" height="90" rx="18" stroke="#F2C14E"/>
    </g>

    <g text-anchor="middle" font-size="22" font-weight="700">
      <text x="115" y="179">Job</text>
      <text x="345" y="163">Classify</text>
      <text x="345" y="192" font-size="18" fill="#A3ABC8">How smart?</text>
      <text x="620" y="163">Privacy gate</text>
      <text x="620" y="192" font-size="18" fill="#A3ABC8">Default: closed</text>
      <text x="985" y="179">Free platform first</text>
      <text x="135" y="418">Antigravity</text>
      <text x="360" y="418">Codex</text>
      <text x="590" y="418">Extra platforms</text>
      <text x="830" y="402">Claude last</text>
      <text x="830" y="431" font-size="18" fill="#A3ABC8">Reserve kept</text>
      <text x="1065" y="402">Another family</text>
      <text x="1065" y="431" font-size="18" fill="#A3ABC8">Verifies</text>
    </g>

    <g text-anchor="middle" font-size="17" fill="#A3ABC8">
      <text x="771" y="147" font-size="13">Public</text>
      <text x="620" y="245">Public data + clean scan</text>
      <text x="985" y="245">Only if smart enough and key present</text>
      <text x="360" y="271">Otherwise: skip free</text>
      <text x="135" y="491">0% reserve</text>
      <text x="360" y="491">30% weekly</text>
      <text x="590" y="491">Your settings</text>
      <text x="830" y="483">30% weekly</text>
      <text x="830" y="506">15% in 5 hours</text>
      <text x="1065" y="491">Check the evidence</text>
    </g>

    <rect x="40" y="535" width="1120" height="74" rx="18" fill="#1A1F36" stroke="#F2C14E" stroke-width="3.5"/>
    <text x="600" y="582" text-anchor="middle" font-size="29" font-weight="800" fill="#F2C14E">Intelligence threshold never drops</text>
    <text x="600" y="644" text-anchor="middle" font-size="18" fill="#A3ABC8">Even when quota is low or a platform is free. Free allowance is spent first while suitable work fits.</text>
  </g>
</svg>
